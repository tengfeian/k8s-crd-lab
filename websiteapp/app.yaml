apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: websiteapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tengfeian/k8s-crd-lab.git
#    targetRevision: argocd/diff-customization/locked_true
    targetRevision: argocd/diff-customization/locked_false
#    targetRevision: test_locked_v1.0_true
#    targetRevision: test_locked_v2_false
    path: website
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune:  true
      allowEmpty: true
      selfHeal: true
    retry:
      backoff:
        duration: 3m
        factor: 1
        maxDuration: 5m
      limit: 1000000
  ignoreDifferences:
    - group: apps
      kind: Website
      name: website-sample
      namespace: default
      jsonPointers:
        - /spec/locked